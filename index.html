<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мои ссылки</title>
  <meta name="description" content="Всё полезное в одном месте">
  <meta name="theme-color" content="#0b0b12">
  <meta property="og:title" content="Мои ссылки">
  <meta property="og:description" content="Всё полезное в одном месте">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
  <style>
    :root {
      --bg: #0b0b12;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f7;
      --muted: #a1a1b5;
      --accent-1: #25f4ee; /* бирюзовый */
      --accent-2: #fe2c55; /* розовый */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: max(32px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* фоновые пятна */
    body::before, body::after {
      content: "";
      position: fixed;
      width: 70vmax; height: 70vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.22;
      z-index: -1;
      pointer-events: none;
    }
    body::before { background: var(--accent-1); top: -35vmax; left: -30vmax; }
    body::after  { background: var(--accent-2); bottom: -35vmax; right: -30vmax; }

    .wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 28px; }

    header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 44px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      padding: 3px;
    }
    .avatar span {
      width: 100%; height: 100%; border-radius: 50%;
      background: var(--bg);
      display: grid; place-items: center;
    }
    .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    h1 { font-size: 22px; font-weight: 700; }
    .bio { color: var(--muted); font-size: 15px; line-height: 1.45; max-width: 320px; }

    .links { display: flex; flex-direction: column; gap: 14px; }

    .link {
      position: relative;
      display: flex; align-items: center; gap: 14px;
      padding: 16px 18px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      text-decoration: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .link:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.22); }
    .link:active { transform: scale(0.97); }

    .link .icon {
      flex: none;
      width: 48px; height: 48px; border-radius: 14px;
      display: grid; place-items: center;
      font-size: 26px;
    }
    .link .text { flex: 1; min-width: 0; }
    .link .title { display: block; font-size: 17px; font-weight: 650; }
    .link .sub { display: block; font-size: 13.5px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
    .link .arrow { flex: none; color: var(--muted); font-size: 20px; }

    .link.vpn .icon  { background: linear-gradient(135deg, #2aabee, #1c7fd6); }
    .link.site .icon { background: linear-gradient(135deg, #fe2c55, #ff8a00); }

    /* главная кнопка — с переливающейся обводкой */
    .link.featured { border-color: transparent; }
    .link.featured::before {
      content: "";
      position: absolute; inset: -1.5px;
      border-radius: 19px;
      padding: 1.5px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-1));
      background-size: 200% 100%;
      animation: shift 3s linear infinite;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    @keyframes shift { to { background-position: 200% 0; } }

    .link.appear { animation: appear .35s ease both; }
    @keyframes appear { from { opacity: 0; transform: translateY(6px); } }

    .badge {
      position: absolute; top: -9px; right: 14px;
      font-size: 11px; font-weight: 700; letter-spacing: .3px;
      padding: 3px 8px; border-radius: 999px;
      background: var(--accent-2); color: #fff;
    }

    footer { text-align: center; color: var(--muted); font-size: 12px; opacity: .7; }

    @media (prefers-reduced-motion: reduce) {
      .link.featured::before { animation: none; }
      .link { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <!-- Чтобы поставить своё фото: положи avatar.jpg рядом с index.html
           и замени <span>😎</span> на <img src="avatar.jpg" alt=""> -->
      <div class="avatar"><span>😎</span></div>
      <h1>Привет! 👋</h1>
      <p class="bio">Тут всё, о чём я рассказываю в TikTok. Жми на нужную ссылку 👇</p>
    </header>

    <nav class="links">
      <a class="link vpn featured" href="https://t.me/HOV_VPN_BOT?start=ref310748940"
         target="_blank" rel="noopener" data-name="vpn">
        <span class="badge">ТОП</span>
        <span class="icon">🛡️</span>
        <span class="text">
          <span class="title">VPN, которым пользуюсь я</span>
          <span class="sub">Быстрый VPN прямо в Telegram</span>
        </span>
        <span class="arrow">›</span>
      </a>

    </nav>

    <!-- Кнопка сайта. Показывается только посетителям из Беларуси, России, Украины и Узбекистана,
         у каждой страны своя ссылка: их отдаёт /api/links (меняются в api/links.js) -->
    <template id="tpl-site">
      <a class="link site appear" target="_blank" rel="noopener" data-name="site">
        <span class="icon">🎮</span>
        <span class="text">
          <span class="title">Мой любимый сайт</span>
          <span class="sub">Тут я развлекаюсь в свободное время</span>
        </span>
        <span class="arrow">›</span>
      </a>
    </template>

    <footer>© <span id="y"></span></footer>
  </main>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    // Подсчёт кликов по ссылкам (работает, если в Vercel включена Web Analytics)
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    document.querySelector('.links').addEventListener('click', function (e) {
      var a = e.target.closest('.link');
      if (!a) return;
      try { window.va('event', { name: 'click_' + a.dataset.name }); } catch (err) {}
    });

    // Кнопка сайта только для BY, RU, UA и UZ: сервер отдаёт ссылку под страну посетителя
    fetch('/api/links', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (data) {
        if (!data || !data.site) return;
        var node = document.getElementById('tpl-site').content.firstElementChild.cloneNode(true);
        node.href = data.site;
        document.querySelector('.links').appendChild(node);
      })
      .catch(function () { /* нет API (например, файл открыт локально) — просто не показываем */ });
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
